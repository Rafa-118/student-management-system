services:
  - type: web
    name: edumanage
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    preDeployCommand: flask --app run:create_app db upgrade
    startCommand: gunicorn run:app
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: edumanage-db
          property: connectionString
databases:
  - name: edumanage-db
    plan: free
